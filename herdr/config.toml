onboarding = false
[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden" # "compact" by default

[keys]
prefix = "ctrl+w"
new_tab = "prefix+t"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"
new_workspace = "prefix+shift+t"
switch_workspace = "prefix+shift+1..9"
switch_tab = "prefix+1..9"
# focus_workspace = "prefix+ctrl+1..9"

copy_mode = "prefix+("

[theme]
name = "terminal"
auto_switch = false

[experimental]
# Rendu local des images (protocole graphique kitty) dans les panes herdr :
# necessaire pour voir les figures matplotlib des notebooks dans Neovim.
# Le terminal exterieur doit lui aussi supporter le protocole (Ghostty : ok).
kitty_graphics = true
